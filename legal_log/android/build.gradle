// All projects will use these repositories.
allprojects {
    repositories {
        google()  // Ensure this is present to use Google services.
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")  // Ensures the app module is evaluated properly.
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir  // Task to clean the project build.
}

buildscript {
  repositories {
    google() // Ensure the Google repository is included.
  }
  dependencies {
    classpath 'com.google.gms:google-services:4.3.15'  // Google services plugin for Firebase/Drive
  }
}
