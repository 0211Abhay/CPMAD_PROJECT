apply plugin: 'com.android.application'
plugins {
    id "com.android.application"
    // START: Google Play Services Configuration
    id 'com.google.gms.google-services'  // Add this line for Google Services
    // END: Google Play Services Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.example.legal_log"
        minSdkVersion 23  // Minimum required SDK version
        targetSdkVersion 33
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:19.2.0'  // Google Sign-In SDK
    implementation 'com.google.api-client:google-api-client:1.34.0'  // Google Drive API client
}

// Apply Google Services plugin at the bottom
apply plugin: 'com.google.gms.google-services'